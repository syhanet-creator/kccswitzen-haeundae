<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>오프라인 · KCC 스위첸 커뮤니티</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #111827;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
    main { max-width: 360px; padding: 32px 24px; text-align: center; }
    .icon { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 20px; background: linear-gradient(135deg,#1d4ed8,#0ea5e9);
      display: grid; place-items: center; color: #fff; font-size: 32px; font-weight: 800; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #6b7280; line-height: 1.6; }
    button { border: 0; border-radius: 12px; background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; padding: 12px 24px; }
  </style>
</head>
<body>
  <main>
    <div class="icon">KCC</div>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요.<br />이전에 열어 본 화면은 연결 없이도 볼 수 있습니다.</p>
    <button onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
